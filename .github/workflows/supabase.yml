name: Supabase uitrollen (accounts, bestellingen, betalen)
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
concurrency:
  group: supabase
  cancel-in-progress: false
env:
  PROJECT_REF: zuirkmrdscmoonlwpwkj
  SITE_URL: https://spagencybe.github.io/vr-drinks-webshop/
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Controle
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::GitHub-secret SUPABASE_ACCESS_TOKEN ontbreekt"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Database bijwerken (supabase/schema.sql)
        run: |
          jq -Rs '{query: .}' supabase/schema.sql > /tmp/q.json
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /dev/null
          echo "Database bijgewerkt"

      - name: Aanmeldinstellingen (Nederlandstalige mails, terugkeeradres)
        run: |
          jq -n --arg site "$SITE_URL" --rawfile confirm supabase/mail/bevestigen.html --rawfile reset supabase/mail/wachtwoord.html '{
            site_url: $site,
            uri_allow_list: ($site + "**,http://127.0.0.1:8770/**"),
            mailer_autoconfirm: false,
            password_min_length: 8,
            mailer_subjects_confirmation: "Bevestig je account bij VR Drinks",
            mailer_templates_confirmation_content: $confirm,
            mailer_subjects_recovery: "Nieuw wachtwoord voor VR Drinks",
            mailer_templates_recovery_content: $reset
          }' > /tmp/auth.json
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/auth.json > /dev/null
          echo "Aanmeldinstellingen bijgewerkt"

      - name: Geheimen voor de serverfuncties
        env:
          ONLINEFACT_API_KEY: ${{ secrets.ONLINEFACT_API_KEY }}
          ONLINEFACT_API_SECRET: ${{ secrets.ONLINEFACT_API_SECRET }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          ONLINEFACT_ORDERS_ENABLED: ${{ vars.ONLINEFACT_ORDERS_ENABLED || 'false' }}
        run: |
          args=("SITE_URL=$SITE_URL" "ONLINEFACT_ORDERS_ENABLED=$ONLINEFACT_ORDERS_ENABLED")
          [ -n "$ONLINEFACT_API_KEY" ] && args+=("ONLINEFACT_API_KEY=$ONLINEFACT_API_KEY")
          [ -n "$ONLINEFACT_API_SECRET" ] && args+=("ONLINEFACT_API_SECRET=$ONLINEFACT_API_SECRET")
          [ -n "$MOLLIE_API_KEY" ] && args+=("MOLLIE_API_KEY=$MOLLIE_API_KEY") || echo "::warning::MOLLIE_API_KEY ontbreekt: online betalen staat nog uit"
          supabase secrets set --project-ref "$PROJECT_REF" --yes "${args[@]}" > /dev/null
          echo "Geheimen gezet (Onlinefact-doorsturen: $ONLINEFACT_ORDERS_ENABLED)"

      - name: Serverfuncties uitrollen
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes
