name: Publiceer op GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'   # voorraad uit Onlinefact elke 10 minuten
  workflow_dispatch:
    inputs:
      dump:
        description: 'Productlijst tonen in het logboek'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ONLINEFACT_API_KEY: ${{ secrets.ONLINEFACT_API_KEY }}
      ONLINEFACT_API_SECRET: ${{ secrets.ONLINEFACT_API_SECRET }}
      ONLINEFACT_DUMP: ${{ inputs.dump && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Voorraad ophalen uit Onlinefact
        if: env.ONLINEFACT_API_KEY != ''
        continue-on-error: true
        run: node tools/sync-stock.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
